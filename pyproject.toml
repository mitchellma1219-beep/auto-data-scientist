[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-data-scientist"
version = "0.1.0"
description = "Turn raw business data into reproducible, statistically defensible analysis and executive reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pydantic>=2.5",
    "sqlglot>=25",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36", "plotly>=5.20", "pillow>=13.0.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pyyaml>=6"]

[project.scripts]
ads = "auto_data_scientist.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_data_scientist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"examples/**" = ["S311"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*", "sklearn.*", "statsmodels.*", "duckdb.*", "pyarrow.*", "plotly.*"]
ignore_missing_imports = true
